name: Submodule Sync
on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  submodule-sync:
    name: Submodule Sync
    runs-on: ubuntu-latest
    steps:
      - name: Submodule Sync
        uses: mheap/submodule-sync-action@a06903a4e38f042f6f52cc88d184ec1c930ee12d # v1.4.1
        with:
          path: 'submodules/uBlock'
          ref: master
          pr_branch: automated-submodule-update
          target_branch: master
          pr_body: 'Review [gorhill/uBlock](https://github.com/gorhill/uBlock/commits/master) for the commits included in this submodule bump.'
