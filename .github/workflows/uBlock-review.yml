name: uBlock Sync Review
on:
  pull_request:
    paths:
      - 'submodules/uBlock'
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: uBlock-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Asserts that everything the packager executes from the uBlock submodule
  # (the scriptlets import graph) stays inside the repo and inside the LLM
  # review scope declared in .github/pull-merge.json. Sandboxed: no network.
  check-imports:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Block gate tampering, then check out gate files from master
        run: |
          if git diff --name-only origin/master..HEAD -- .github/braveCheckImports.js .github/pull-merge.json .gitmodules | grep -q .; then
            echo "::error::.github/braveCheckImports.js, .github/pull-merge.json or .gitmodules modified by this PR — refusing to run the gates with it."
            exit 1
          fi
          git checkout origin/master -- .github/braveCheckImports.js .github/pull-merge.json
      - name: Install patchutils
        run: sudo apt-get update && sudo apt-get install -y patchutils
      - name: Check out submodule at the PR pin
        run: git submodule update --init
      - name: Run import checker (no network, no secrets)
        run: sudo unshare -n node .github/braveCheckImports.js

  # puLL-Merge cannot review a gitlink-only diff, so attach the scoped upstream
  # diff (.github/uBlock-sync-review.diff) to the PR branch; pull-merge.json
  # includes it in the review scope.
  sync-diff:
    permissions:
      contents: write
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      CARRIER: .github/uBlock-sync-review.diff
      WATCH_GLOBS: >-
        --include=**/assets/assets.json
        --include=**/src/web_accessible_resources/*
        --include=**/src/js/resources/*
        --include=**/src/js/redirect-resources.js
        --include=**/src/js/jsonpath.js
        --include=**/src/js/arglist-parser.js
        --include=**/src/js/urlskip.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install patchutils
        run: sudo apt-get update && sudo apt-get install -y patchutils
      - name: Check out submodule at the PR pin
        run: git submodule update --init
      - name: Generate scoped upstream diff and attach it to the PR branch
        run: |
          set -euo pipefail
          old=$(git rev-parse "origin/master:submodules/uBlock")
          new=$(git rev-parse "HEAD:submodules/uBlock")
          cd submodules/uBlock
          # The old pin predates the gorhill repoint right after the repoint
          # lands (it is a fork-only commit); fall back to the empty tree so
          # the whole watched content gets reviewed once.
          git fetch -q origin "$old" || true
          if git cat-file -e "${old}^{commit}" 2>/dev/null; then
            range="$old..$new"
          else
            range="$(git hash-object -t tree /dev/null)..$new"
            echo "Old pin $old is not in upstream history; diffing the full watched tree."
          fi
          git diff $range | filterdiff $WATCH_GLOBS > "$GITHUB_WORKSPACE/$CARRIER"
          cd "$GITHUB_WORKSPACE"
          if git diff --exit-code --quiet -- "$CARRIER"; then
            echo "Review diff unchanged; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$CARRIER"
            git commit -m "chore(review): attach uBlock sync diff for puLL-Merge review"
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi

  pull-merge:
    needs: [check-imports, sync-diff]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run puLL-Merge
        uses: brave/pull-merge@main
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          prnum: ${{ github.event.number }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          debug: 'true'

  on-failure:
    permissions: {}
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' && (needs.check-imports.result == 'failure' || needs.sync-diff.result == 'failure' || needs.pull-merge.result == 'failure') }}
    needs:
      - check-imports
      - sync-diff
      - pull-merge
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@28ba43ae48961b90635b50953d216767a6bea486 # v3.16.2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          author_name: Github Actions
          status: failure
          fields: repo,message,commit,author,eventName,ref,workflow,pullRequest
          text: "<!subteam^${{ secrets.UBLOCK_SYNC_REVIEWERS_SLACK_GROUP_ID }}> uBlock sync review failed for ${{ github.repository }} (PR #${{ github.event.number }}). Check the failed run and re-run or fix as needed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"